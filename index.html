<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租赁线上化 · 台账工作台</title>
<style>
:root{
  --bg:#f7f7f8; --card:#ffffff; --card-fg:#1a1a1a; --muted:#f1f1f3; --muted-fg:#6b6b73;
  --border:#e6e6eb; --hairline:#ececef; --primary:#2563eb; --primary-fg:#ffffff; --ring:rgba(37,99,235,.35);
  --destructive:#dc2626; --destructive-tint:#fdecec; --success:#15803d; --success-tint:#e8f6ee;
  --warning:#b45309; --warning-tint:#fdf3e3; --info:#2563eb; --info-tint:#eaf1fe;
  --shadow-raised:0 0 0 1px #e6e6eb,0 1px 2px rgba(0,0,0,.04);
  --drop-shadow:0 10px 30px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--card-fg);font-size:14px;line-height:1.5}
.tnum{font-variant-numeric:tabular-nums}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}
.topbar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.brand .dot{width:20px;height:20px;border-radius:6px;background:var(--primary);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.top-right{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted-fg)}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:220px;padding:16px 12px;border-right:1px solid var(--hairline);background:var(--bg)}
.side-group{margin-bottom:18px}
.side-title{font-size:11px;color:var(--muted-fg);padding:6px 10px}
.side-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#3a3a42;font-size:13.5px}
.side-item:hover{background:var(--muted)}
.side-item.active{background:var(--muted);color:var(--card-fg);font-weight:600}
.side-item .ico{width:16px;text-align:center;font-size:14px;color:var(--muted-fg)}
.main{flex:1;padding:24px 28px;max-width:1160px;margin:0 auto}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.quick-card{border:1px solid var(--hairline);border-radius:10px;background:var(--card);padding:16px;cursor:pointer;transition:.15s}.quick-card:hover{border-color:var(--primary);box-shadow:var(--shadow-raised)}.quick-card b{display:block;font-size:15px;margin-bottom:4px}.quick-card span{font-size:12.5px;color:var(--muted-fg)}.flow{display:flex;gap:0;align-items:stretch;margin:12px 0 20px}.flow-step{flex:1;padding:12px 10px;background:var(--muted);border-right:1px solid var(--card);font-size:12px;color:var(--muted-fg)}.flow-step:first-child{border-radius:8px 0 0 8px}.flow-step:last-child{border-radius:0 8px 8px 0;border-right:0}.flow-step b{display:block;color:var(--card-fg);font-size:13px;margin-bottom:3px}.link-card{background:var(--info-tint);border:1px solid #cfe0ff;border-radius:10px;padding:14px 16px;margin-bottom:20px}.link-card .btn{margin-left:8px}@media(max-width:800px){.quick-grid{grid-template-columns:1fr}.flow{overflow-x:auto}.flow-step{min-width:130px}}
.page-title{font-size:22px;font-weight:600;margin-bottom:4px}
.page-sub{font-size:13.5px;color:var(--muted-fg);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--hairline);border-radius:10px;margin-bottom:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.card-t{font-size:17px;font-weight:600}
.card-b{padding:20px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;line-height:1.7}
.badge .p{width:6px;height:6px;border-radius:50%}
.b-neutral{background:var(--muted);color:#55555e}
.b-success{background:var(--success-tint);color:var(--success)}
.b-warning{background:var(--warning-tint);color:var(--warning)}
.b-info{background:var(--info-tint);color:var(--info)}
.b-destructive{background:var(--destructive-tint);color:var(--destructive)}
.b-success .p,.b-info .p{background:currentColor}
.b-warning .p{background:var(--warning)}
.b-destructive .p{background:var(--destructive)}
.b-neutral .p{background:#8a8a93}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;background:transparent;white-space:nowrap;color:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-secondary{background:var(--card);border-color:var(--border);box-shadow:var(--shadow-raised)}
.btn-ghost{color:#3a3a42}
.btn-ghost:hover{background:var(--muted)}
.btn-destructive{background:var(--destructive-tint);color:var(--destructive)}
.btn-destructive:hover{background:var(--destructive);color:#fff}
.btn-sm{height:24px;padding:0 10px;font-size:13px;border-radius:6px}
.field{margin-bottom:14px}
.label{display:block;font-size:13px;color:#3a3a42;margin-bottom:6px}
.input,.select,.textarea{width:100%;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:14px;color:var(--card-fg)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
.textarea{height:auto;padding:8px 12px;resize:vertical}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:500;color:var(--muted-fg);text-align:left;padding:10px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--hairline);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafb}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-actions{white-space:nowrap;text-align:right}
.empty{text-align:center;color:var(--muted-fg);padding:36px 0;font-size:14px}
.skel-row{height:16px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,var(--hairline) 25%,rgba(127,127,127,.14) 37%,var(--hairline) 63%);background-size:400% 100%;animation:skelShift 1.2s ease-in-out infinite}
@keyframes skelShift{0%{background-position:100% 50%}100%{background-position:0 50%}}
.err-box{background:var(--destructive-tint);color:var(--destructive);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px}
@keyframes busySlide{0%{background-position:200% 0}100%{background-position:-200% 0}}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-card{width:380px;padding:32px;border:1px solid var(--hairline);border-radius:12px;background:var(--card)}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.login-brand .dot{width:34px;height:34px;border-radius:10px;background:var(--primary);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.login-brand b{font-size:18px}
.login-title{font-size:20px;font-weight:600;margin-bottom:6px}
.login-sub{font-size:13.5px;color:var(--muted-fg);margin-bottom:24px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.dialog{width:620px;max-width:94vw;background:var(--card);border-radius:12px;box-shadow:var(--drop-shadow);overflow:hidden}
.dialog-h{padding:20px 24px 0;font-size:17px;font-weight:600}
.dialog-b{padding:20px 24px;max-height:70vh;overflow:auto}
.dialog-f{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--hairline)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);margin-bottom:16px}
.tab{padding:8px 16px;font-size:14px;color:var(--muted-fg);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.kv .item{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--hairline)}
.kv .k{color:var(--muted-fg)}
.kv .v{font-weight:500;text-align:right}
.seg-row{display:grid;grid-template-columns:1fr 1fr .6fr 1fr 1fr 32px;gap:8px;margin-bottom:8px;align-items:center}
.seg-head{font-size:12px;color:var(--muted-fg);font-weight:600;margin-bottom:4px}
.seg-sum{margin-top:10px;font-size:13.5px;color:var(--card-fg);font-weight:600}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.quick-card{border:1px solid var(--hairline);border-radius:10px;background:var(--card);padding:16px;cursor:pointer}.quick-card:hover{border-color:var(--primary);box-shadow:var(--shadow-raised)}.quick-card b{display:block;font-size:15px;margin-bottom:4px}.quick-card span{font-size:12.5px;color:var(--muted-fg)}.flow{display:flex;margin:12px 0 20px}.flow-step{flex:1;padding:12px 10px;background:var(--muted);border-right:1px solid var(--card);font-size:12px;color:var(--muted-fg)}.flow-step b{display:block;color:var(--card-fg);font-size:13px;margin-bottom:3px}.link-card{background:var(--info-tint);border:1px solid #cfe0ff;border-radius:10px;padding:14px 16px;margin-bottom:20px}.link-card .btn{margin-left:8px}</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><span class="dot">租</span><b>租赁线上化</b></div>
    <div class="login-title">登录台账工作台</div>
    <div class="login-sub">合同台账 · 三台账生成 · 一级审批</div>
    <div id="loginErr" class="err-box" style="display:none"></div>
    <div class="field"><label class="label">账号</label><input id="liAcct" class="input" autocomplete="username"></div>
    <div class="field"><label class="label">密码</label><input id="liPwd" type="password" class="input" autocomplete="current-password"></div>
    <div style="margin-top:20px"><button id="btnLogin" class="btn btn-primary" style="width:100%;height:36px">登 录</button></div>
    <div style="margin-top:14px;text-align:center">
      <span class="hint">账号不开放自助注册</span>
      <button id="btnApply" class="btn btn-secondary btn-sm" style="margin-left:8px">申请账号</button>
    </div>
  </div>
</div>

<div id="appView" style="display:none">
  <div id="busyBar" style="display:none;position:fixed;top:52px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent);background-size:200% 100%;animation:busySlide 1s linear infinite;z-index:200"></div>
  <div class="topbar">
    <div class="brand"><span class="dot">租</span><b>租赁线上化</b></div>
    <div class="top-right"><span id="meLabel">—</span><button id="btnLogout" class="btn btn-ghost btn-sm">退出</button></div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="content"></div>
  </div>
</div>

<div id="dlgCard" class="overlay">
  <div class="dialog">
    <div class="dialog-h">新建租赁卡片</div>
    <div class="dialog-b" id="dlgCardBody"></div>
    <div class="dialog-f">
      <button class="btn btn-ghost" data-action="close-dlg" data-id="dlgCard">取消</button>
      <button class="btn btn-primary" id="dlgCardOk" data-action="create-card">保存草稿</button>
    </div>
  </div>
</div>

<div id="dlgRegister" class="overlay">
  <div class="dialog" style="width:520px">
    <div class="dialog-h">申请账号</div>
    <div class="dialog-b">
      <div class="hint" style="margin-bottom:12px">提交后由管理员开通，开通前无法登录。管理员可在「账号申请」中处理。</div>
      <div class="grid grid-2">
        <div class="field"><label class="label">登录账号 *</label><input id="rgAcct" class="input" placeholder="字母/数字/下划线"></div>
        <div class="field"><label class="label">姓名 *</label><input id="rgName" class="input"></div>
        <div class="field"><label class="label">密码 *（至少6位）</label><input id="rgPwd" type="password" class="input"></div>
        <div class="field"><label class="label">申请角色 *</label><select id="rgRole" class="select"></select></div>
      </div>
      <div class="field" style="margin-top:12px"><label class="label">申请说明</label><input id="rgNote" class="input" placeholder="如：负责深圳片区台账维护"></div>
      <div class="err-box" id="rgErr" style="display:none;margin-top:12px"></div>
    </div>
    <div class="dialog-f">
      <button class="btn btn-ghost" data-action="close-dlg" data-id="dlgRegister">取消</button>
      <button class="btn btn-primary" data-action="register-submit">提交申请</button>
    </div>
  </div>
</div>

<div id="dlgOpinion" class="overlay">
  <div class="dialog" style="width:440px">
    <div class="dialog-h" id="opinH">审批</div>
    <div class="dialog-b">
      <div class="field"><label class="label" id="opinLabel">意见</label><textarea id="opinText" class="textarea" rows="3"></textarea></div>
    </div>
    <div class="dialog-f">
      <button class="btn btn-ghost" data-action="close-dlg" data-id="dlgOpinion">取消</button>
      <button class="btn btn-primary" data-action="opin-ok">确定</button>
    </div>
  </div>
</div>

<script>
/* ===== 缓存策略：按资源分级 TTL（毫秒） ===== */
var CACHE_RULES = [
  [/^\/api\/todo/, 10000],
  [/^\/api\/cards/, 15000],
  [/^\/api\/payments/, 15000],
  [/^\/api\/vouchers/, 30000],
  [/^\/api\/reports/, 30000],
  [/^\/api\/master/, 60000],
  [/^\/api\/me$/, 60000]
];
/* 写操作 → 需要作废的缓存前缀；未登记的一律整体作废（宁多清、不漏清） */
var WRITE_INVALIDATE = [
  [/^\/api\/cards$/,                       ['/api/cards', '/api/todo', '/api/payments', '/api/reports', '/api/vouchers']],
  [/^\/api\/cards\/[^/]+\/overview$/,      ['/api/cards', '/api/todo', '/api/reports']],
  [/^\/api\/cards\/[^/]+\/basic$/,         ['/api/cards', '/api/todo']],
  [/^\/api\/cards\/[^/]+\/ledger-adjust$/, ['/api/cards', '/api/todo']],
  [/^\/api\/cards\/[^/]+\/generate$/,      ['/api/cards', '/api/todo', '/api/payments', '/api/vouchers', '/api/reports']],
  [/^\/api\/cards\/[^/]+\/submit$/,        ['/api/cards', '/api/todo']],
  [/^\/api\/cards\/[^/]+\/(approve|reject)$/, ['/api/cards', '/api/todo', '/api/payments', '/api/reports']],
  [/^\/api\/cards\/[^/]+\/delete$/,        ['/api/cards', '/api/todo']],
  [/^\/api\/payments/,                     ['/api/payments', '/api/cards', '/api/reports']],
  [/^\/api\/vouchers/,                     ['/api/vouchers', '/api/reports']],
  [/^\/api\/shares\//,                     ['/api/cards']],
  [/^\/api\/oneoff\//,                     ['/api/cards']],
  [/^\/api\/master\//,                     ['/api/master']],
  [/^\/api\/admin\/requests/,              ['/api/admin/requests']]
];

var API = {
  _tok: localStorage.getItem('zl_token') || '',
  _busy: 0,
  _quiet: 0,
  _cache: {},                       // "GET <path>" -> {at, value}
  _pending: {},                     // "GET <path>" -> 进行中的 Promise（请求合并）
  _cacheTTL: 15000,

  getCacheKey(method, path){ return method + ' ' + path; },
  ttlFor(path){
    for(var i=0;i<CACHE_RULES.length;i++){ if(CACHE_RULES[i][0].test(path)) return CACHE_RULES[i][1]; }
    return this._cacheTTL;
  },
  clear(){ this._cache = {}; return 0; },
  invalidate(prefix){
    var n=0;
    for(var k in this._cache){ if(k.indexOf(prefix)>=0){ delete this._cache[k]; n++; } }
    return n;
  },
  invalidateFor(path){
    var list=null;
    for(var i=0;i<WRITE_INVALIDATE.length;i++){
      if(WRITE_INVALIDATE[i][0].test(path)){ list=WRITE_INVALIDATE[i][1]; break; }
    }
    if(list){ for(var j=0;j<list.length;j++) this.invalidate(list[j]); }
    else { this.clear(); }
  },
  /* 预加载：只填充缓存，不改变当前视图；已缓存或已在途则跳过 */
  prefetch(paths, quiet){
    var self=this;
    (paths||[]).forEach(function(p){
      var key=self.getCacheKey('GET',p);
      var hit=self._cache[key];
      if(hit && (Date.now()-hit.at) < self.ttlFor(p)) return;
      if(self._pending[key]) return;
      self.req('GET', p, undefined, undefined, quiet===false?false:true).catch(function(){});
    });
    return true;
  },

  async req(method, path, body, timeoutMs, quiet){
    var self=this;
    var isGet=(method==='GET' && body===undefined);
    var key=this.getCacheKey(method, path);

    if(isGet){
      var hit=this._cache[key];
      if(hit && (Date.now()-hit.at) < this.ttlFor(path)) return hit.value;
      if(this._pending[key]) return this._pending[key];        // 相同请求合并为一次
    }

    var run = async function(){
      var p=path, opts={method: method, headers:{'Content-Type':'application/json'}};
      if(body === undefined){
        p = path + (path.indexOf('?')>=0?'&':'?') + 'token=' + encodeURIComponent(self._tok);
      } else {
        body._token = self._tok;
        opts.body = JSON.stringify(body);
      }
      // 超时控制，避免请求挂起导致"卡死"；OCR 首次加载引擎较慢，需更长超时
      var ctrl = new AbortController();
      opts.signal = ctrl.signal;
      var timer = setTimeout(function(){ctrl.abort();}, timeoutMs || 20000);
      if(quiet){ self._quiet++; } else { self._busy++; showBusy(true); }
      try {
        var r = await fetch(p, opts);
        var j = await r.json().catch(function(){return {}});
        if(r.status === 401 && path.indexOf('/api/login') < 0){
          localStorage.removeItem('zl_token'); self.clear(); location.reload();
          throw new Error('登录过期');
        }
        var out = {status:r.status, data:j};
        // 只缓存成功响应；失败/越权/空响应不进缓存，避免把错误状态固化
        if(isGet && r.status===200 && j && j.ok !== false){
          self._cache[key] = {at: Date.now(), value: out};
        }
        if(!isGet){ self.invalidateFor(path); }
        return out;
      } finally {
        clearTimeout(timer);
        if(quiet){ self._quiet--; } else { self._busy--; if(self._busy<=0) showBusy(false); }
      }
    };

    var task = run();
    if(isGet){
      this._pending[key] = task;
      var done=function(){ delete self._pending[key]; };
      task.then(done, done);
    }
    return task;
  }
};
function showBusy(on){
  var el=document.getElementById('busyBar');
  if(!el) return;
  el.style.display = on ? 'block' : 'none';
}
var ME = null;
var stateColor = {'草稿':'b-neutral','待审':'b-warning','通过':'b-success','退回':'b-destructive'};
/* 业务状态元数据：前端只做展示映射，状态本身由后端 get_card_stage 推导，避免口径不一致 */
var STATUS_META = {
  '待人工核对': {label:'待人工核对', tone:'b-warning'},
  '待补金额':   {label:'待补金额',   tone:'b-warning'},
  '待生成台账': {label:'待生成台账', tone:'b-warning'},
  '待复核':     {label:'待复核',     tone:'b-warning'},
  '待提交审批': {label:'待提交审批', tone:'b-warning'},
  '待审批':     {label:'待审批',     tone:'b-warning'},
  '退回待修改': {label:'退回待修改', tone:'b-destructive'},
  '已通过':     {label:'已通过',     tone:'b-success'},
  '草稿':      {label:'草稿',      tone:'b-neutral'}
};
var NEXT_ACTION_LABEL = {
  'continue-review':'继续人工核对', 'fill-amount':'补录金额', 'generate-ledger':'生成租赁台账',
  'review-ledger':'复核台账', 'submit-card':'提交审批', 'approve':'去审批',
  'edit-card':'修改合同', 'open-payment':'查看付款'
};
function stageBadge(stage){
  var m=STATUS_META[stage]||{label:stage,tone:'b-neutral'};
  return '<span class="badge '+m.tone+'"><span class="p"></span>'+esc(m.label)+'</span>';
}
function progressBar(stepIndex, steps){
  steps = steps || ['资料进入','人工核对','业务校验','租赁计算','复核','提交'];
  var n=Number(stepIndex)||0;
  return '<div class="flow">'+steps.map(function(s,i){
    var done=(i<n);
    return '<div class="flow-step" style="'+(done?'border-color:var(--primary);background:var(--muted)':'')+'"><b>'
      +(i+1)+' '+esc(s)+'</b>'+(done?'已完成':'待完成')+'</div>';
  }).join('')+'</div>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '¥'+(Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function num(n){return (Number(n)||0).toLocaleString('zh-CN',{maximumFractionDigits:4});}
function badge(s){return '<span class="badge '+(stateColor[s]||'b-neutral')+'"><span class="p"></span>'+esc(s||'—')+'</span>';}
function fv(v){ if(v==null||v==='')return ''; if(typeof v==='object'){ if('text'in v)return v.text; if('select'in v)return v.select; if('number'in v)return v.number; if('currency'in v)return v.currency; if('checkbox'in v)return v.checkbox?'是':'否'; if('date'in v)return (v.date||'').slice(0,10); if('title'in v)return v.title; return '';} return v; }

function renderSkeleton(v){
  var c=document.getElementById('content');
  if(!c) return;
  var title=VIEW_TITLES[v]||'加载中';
  var rows='';
  for(var i=0;i<3;i++) rows+='<div class="skel-row"></div>';
  // 骨架屏而非空白页：用户立刻看到"这块要出什么"
  c.innerHTML='<div class="page-title">'+esc(title)+'</div>'
    +'<div class="page-sub">正在加载…</div>'
    +'<div class="card"><div class="card-b">'+rows+'</div></div>';
}

function switchView(v){
  curView=v; viewSeq++;
  document.querySelectorAll('.side-item').forEach(function(el){el.classList.toggle('active',el.dataset.view===v);});
  renderSkeleton(v);
  return viewSeq;
}
function viewStill(seq, v){ return seq===viewSeq && curView===v; }

/* 统一导航入口：任何地方跳转都走这里，避免分发逻辑散落各处 */
function navigate(view, params){
  var fn=ROUTES[view];
  if(typeof fn!=='function'){ return; }
  APP_STATE.currentView=view;
  try { return fn(params); }
  catch(e){ APP_STATE.lastError=e; console && console.error && console.error(e); }
}

function renderCards(list,title,showNew){
  var rows=list.map(function(c){
    var st=fv(c['审批状态']);
    var ovN=c['_overview_count']||0, ldN=c['_ledger_count']||0;
    var acts='<button class="btn btn-ghost btn-sm" data-action="card-detail" data-id="'+esc(c['record_id'])+'">详情</button> ';
    // 步骤化推进：根据状态显示"下一步"，只有一个主操作高亮
    if(canCreate() && (st==='草稿'||st==='退回')){
      var step, stepAction, stepLabel;
      if(ovN===0){
        // 第一步：录入金额
        stepAction='edit-overview'; stepLabel='① 录入金额';
      } else if(ldN===0){
        // 第二步：生成台账（含 IFRS 明细，当「是否IFRS=是」时一并生成）
        var _isf=(fv(c['是否IFRS'])==='是');
        stepAction='gen-ledger'; stepLabel='② 生成台账'+( _isf?'（含IFRS）':'');
      } else {
        // 第三步：提交审批
        stepAction='card-submit'; stepLabel='③ 提交审批';
      }
      acts+='<button class="btn btn-primary btn-sm" data-action="'+stepAction+'" data-id="'+esc(c['record_id'])+'">'+stepLabel+'</button> ';
      // 草稿可删除
      if(st==='草稿'){
        acts+='<button class="btn btn-ghost btn-sm" data-action="card-delete" data-id="'+esc(c['record_id'])+'" style="color:var(--destructive)">删除</button>';
      }
    }
    // 步骤指示徽标
    var stepBadge='';
    if(st==='草稿'||st==='退回'){
      var done = (ovN>0?1:0)+(ldN>0?1:0);
      stepBadge='<span class="hint" style="font-size:12px">('+(done===0?'未开始':done===1?'已录金额':'已生成台账')+')</span>';
    }
    return '<tr><td class="tnum">'+esc(fv(c['合同编码']))+'</td><td>'+esc(fv(c['卡片名称']))+'</td><td>'+esc(fv(c['费用类型']))+'</td><td>'+esc(fv(c['承租方']))+'</td><td>'+esc(fv(c['提交人']))+'</td><td>'+badge(st)+stepBadge+'</td><td class="tbl-actions">'+acts+'</td></tr>';
  }).join('');
  var head = showNew && canCreate() ? '<div style="margin-bottom:16px"><button class="btn btn-primary" data-action="open-card">＋ 新建租赁卡片</button></div>' : '';
  renderList(title,(showNew?'全部租赁卡片':'我提交的租赁卡片'), head+(list.length?table(['合同编码','卡片名称','费用类型','承租方','提交人','状态','操作'],rows):empty('暂无卡片')));
}

function table(heads,rows){
  return '<div class="card"><div class="tbl-wrap"><table><thead><tr>'
    + heads.map(function(h){var n=(h==='操作')?'num':'';return '<th class="'+n+'">'+h+'</th>';}).join('')
    +'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function empty(t){return '<div class="card"><div class="card-b"><div class="empty">'+t+'</div></div></div>';}
function renderList(title,sub,body){
  document.getElementById('content').innerHTML = '<div class="page-title">'+title+'</div><div class="page-sub">'+sub+'</div>'+body;
}
function renderEmpty(title,inner){
  document.getElementById('content').innerHTML = '<div class="page-title">'+title+'</div>'+inner;
}

/* ===== 卡片详情 + 三台账 ===== */
/* curCard / curTab 由 APP_STATE 统一托管（见顶部 defineProperty） */
async function showDetail(id){
  switchView('detail');
  curTab='info';
  // 不再单独拉一次卡片：/context 已聚合卡片本体，详情页因此只发 1 次请求
  return renderDetail(id);
}
/* 进入详情页：先切视图再渲染，避免从列表进来时 renderDetail 的守卫把内容吞掉 */
async function goDetail(){ switchView('detail'); await renderDetail(); }
function switchTab(name){
  var t=document.querySelector('.tab[data-tab="'+name+'"]');
  if(!t) return;
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.dataset.tab===name);});
  if(name!=='ledger') _ledgerEdit=false;
  var body=document.getElementById('tabBody');
  if(!body) return;
  var cache=window._detailCache||{};
  if(name==='info'){ /* 已渲染 */ }
  else if(name==='overview'){ body.innerHTML=tabOverview(cache.overview||[]); }
  else if(name==='ledger'){ body.innerHTML=tabLedger(cache.ledger||[]); }
  else if(name==='ifrs'){ body.innerHTML=tabIfrs(cache.ifrs||[]); }
}
function primaryActionHtml(stage, id, approvalState){
  var na=stage&&stage.next_action;
  var canEdit=canCreate() && (approvalState==='草稿'||approvalState==='退回');
  if(na==='generate-ledger' && canEdit)
    return '<button class="btn btn-primary btn-sm" data-action="gen-ledger" data-id="'+esc(id)+'">生成租赁台账</button>';
  if(na==='fill-amount' && canEdit)
    return '<button class="btn btn-primary btn-sm" data-action="edit-overview" data-id="'+esc(id)+'">录入金额概览</button>';
  if(na==='continue-review' && canEdit)
    return '<button class="btn btn-primary btn-sm" data-action="edit-basic">核对并修改基础信息</button>';
  if(na==='submit-card' && canEdit)
    return '<button class="btn btn-primary btn-sm" data-action="card-submit" data-id="'+esc(id)+'">提交审批</button>';
  if(na==='approve' && canApprove())
    return '<span class="hint">该卡片待审批，请在下方使用「通过 / 退回」处理</span>';
  if(na==='open-payment')
    return '<button class="btn btn-secondary btn-sm" data-action="show-home-next" data-view-target="payments">查看付款清单</button>';
  if(na==='edit-card' && canEdit)
    return '<button class="btn btn-primary btn-sm" data-action="edit-basic">修改合同</button>';
  return '<span class="hint">当前无可执行操作</span>';
}

/* 关联记录：审批 / 付款 / 凭证 / 版本 —— 详情页闭环的最后一段 */
function renderRelations(ctx){
  var tk=ctx.tickets||[], pay=ctx.payments||[], vou=ctx.vouchers||[], ver=ctx.versions||[];
  function block(title, count, tableHtml){
    return '<div class="card"><div class="card-h"><div class="card-t">'+esc(title)+'</div>'
      +'<span class="hint">'+(count?count+' 条':'暂无')+'</span></div><div class="card-b">'
      +(count?tableHtml:'<div class="empty">暂无记录</div>')+'</div></div>';
  }
  var tkHtml=tk.length? table(['提交人','结论','意见','时间'],
    tk.map(function(t){
      return '<tr><td>'+esc(fv(t['提交人'])||'—')+'</td><td>'+esc(fv(t['状态'])||'—')+'</td>'
        +'<td>'+esc(fv(t['审批意见'])||'—')+'</td><td>'+esc((fv(t['提交时间'])||'').slice(0,16))+'</td></tr>';
    }).join('')) : '';
  var payHtml=pay.length? table(['计划付款月','金额','费用所属期间','约定付款日'],
    pay.map(function(p){
      return '<tr><td class="tnum">'+esc((fv(p['月份'])||'').slice(0,7))+'</td>'
        +'<td class="num">'+money(fv(p['计划付款金额']))+'</td>'
        +'<td>'+esc(fv(p['费用所属期间'])||'—')+'</td>'
        +'<td class="tnum">'+esc((fv(p['约定付款日期'])||'').slice(0,10))+'</td></tr>';
    }).join('')) : '';
  var vouHtml=vou.length? table(['凭证类型','期间','摘要','金额'],
    vou.slice(0,20).map(function(v){
      return '<tr><td>'+esc(fv(v['凭证类型'])||fv(v['类型'])||'—')+'</td>'
        +'<td class="tnum">'+esc(fv(v['会计期间'])||fv(v['期间'])||'—')+'</td>'
        +'<td>'+esc(fv(v['摘要'])||'—')+'</td>'
        +'<td class="num">'+money(fv(v['金额']))+'</td></tr>';
    }).join('')) : '';
  var verHtml=ver.length? table(['版本','时间','说明'],
    ver.map(function(x){
      return '<tr><td>'+esc(fv(x['版本号'])||'—')+'</td>'
        +'<td class="tnum">'+esc((fv(x['创建时间'])||fv(x['提交时间'])||'').slice(0,16))+'</td>'
        +'<td>'+esc(fv(x['变更说明'])||fv(x['说明'])||'—')+'</td></tr>';
    }).join('')) : '';
  return block('审批记录', tk.length, tkHtml)
    +block('付款记录', pay.length, payHtml)
    +block('凭证记录', vou.length, vouHtml)
    +block('版本记录', ver.length, verHtml);
}

async function renderDetail(passedId){
  var detailSeq=viewSeq;
  _ledgerEdit=false;
  var id=passedId || (curCard && curCard['record_id']);
  if(!id){ renderEmpty('合同详情','<div class="err-box">缺少卡片标识</div>'); return; }
  // 详情页只发 1 次请求：后端聚合 卡片 + 阶段 + 校验 + 三台账 + 审批/付款/凭证
  var r=await API.req('GET','/api/cards/'+id+'/context');
  if(!viewStill(detailSeq,'detail')) return;
  if(r.status>=400 || !r.data.ok){
    renderEmpty('合同详情','<div class="err-box">'+esc((r.data&&r.data.error)||'加载失败，请重试')+'</div>');
    return;
  }
  var ctx=r.data;
  if(ctx.card){ curCard=ctx.card; }          // 以服务端最新数据为准
  var overview=ctx.overview||[], ledger=ctx.ledger||[], ifrs=ctx.ifrs||[];
  var stage=ctx.stage||{}, vres=ctx.validation||{};
  var st=fv(curCard['审批状态']);
  var actions='<button class="btn btn-ghost btn-sm" data-action="show-cards">← 返回</button> ';
  var editable=(st==='草稿'||st==='退回');
  // 审批人在详情页也要能审批：原来只有"待我审批"列表有按钮，从台账列表进详情就没有
  if(canApprove() && st==='待审'){
    var selfSubmit = fv(curCard['提交人']) && fv(curCard['提交人'])===(ME&&ME.name);
    if(selfSubmit){
      actions+='<span class="hint" style="color:var(--destructive)">你就是提交人，不能审批自己的卡片</span>';
    } else {
      actions+='<button class="btn btn-secondary btn-sm" data-action="approve" data-id="'+esc(id)+'">通过</button> '
        +'<button class="btn btn-destructive btn-sm" data-action="reject" data-id="'+esc(id)+'">退回</button>';
    }
  }
  if(canCreate() && editable){
    actions+='<button class="btn btn-secondary btn-sm" data-action="edit-basic">编辑基础信息</button>';
  }
  var infoHtml='<div class="card"><div class="card-b"><div class="kv">'
    +kv('合同编码',curCard['合同编码'])+kv('卡片名称',curCard['卡片名称'])+kv('费用类型',curCard['费用类型'])
    +kv('甲方（出租方）',curCard['甲方'])+kv('承租方',curCard['承租方'])+kv('实际付款方',curCard['实际付款方'])+kv('实际收款方',curCard['实际收款方'])
    +kv('租赁地址',curCard['租赁地址'])+kv('省市',(fv(curCard['省级'])+' '+fv(curCard['市级'])+' '+fv(curCard['区镇'])).trim())
    +kv('片区/业务模块',(fv(curCard['片区'])+' / '+fv(curCard['业务模块'])).trim())
    +kv('建筑面积/实用面积',(num(curCard['建筑面积'])+' / '+num(curCard['实用面积'])+' ㎡'))
    +kv('租赁起始日',curCard['租赁起始日'])+kv('租赁终止日',curCard['租赁终止日'])
    +kv('计费算法',curCard['计费算法'])+kv('结算方式',curCard['结算方式'])
    +kv('约定付款日',curCard['约定付款日期'])+kv('提单部门',curCard['提单部门'])
    +kv('是否含税',curCard['是否含税'])+kv('税率',curCard['税率'])+kv('是否IFRS',curCard['是否IFRS'])
    +kv('IFRS折现率',curCard['IFRS折现率'])+kv('预付租金',money(curCard['预付租金']))
    +kv('合同状态',curCard['合同状态'])+kv('审批状态',badge(st))
    +kv('备注',curCard['备注'])
    +'</div></div></div>';

  // 顶部状态条：状态/阶段/最后更新/唯一下一步 + 业务进度条 + 阻塞问题
  var blockers=(stage.blocking_reasons||[]).slice();
  var errs=(vres.errors||[]), warns=(vres.warnings||[]);
  var statusHtml='<div class="card"><div class="card-h"><div class="card-t">当前状态</div>'
    +'<span>'+stageBadge(stage.stage)+'</span></div><div class="card-b">'
    +'<div class="kv">'+kv('当前阶段',stage.stage)+kv('审批状态',badge(st))
      +kv('最后更新',(fv(curCard['提交时间'])||'').slice(0,10)||'—')
      +kv('阻塞项',blockers.length?String(blockers.length)+' 项':'无')+'</div>'
    +((blockers.length||errs.length)
      ? '<div class="err-box" style="margin:8px 0">'+ (blockers.concat(errs.map(function(e){return e.message;}))).map(function(x){return '• '+esc(x);}).join('<br>')+'</div>'
      : '')
    +(warns.length? '<div class="hint" style="margin:6px 0">'+warns.map(function(w){return '• '+esc(w.message);}).join('<br>')+'</div>':'')
    +'<div style="margin-top:10px">'+progressBar(stage.step_index, stage.steps)+'</div>'
    +'<div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    +primaryActionHtml(stage,id,st)
    +((stage.blocking_reasons||[]).some(function(x){return String(x).indexOf('OCR')>=0;})
        ? '<button class="btn btn-secondary btn-sm" data-action="ocr-confirm" data-id="'+esc(id)+'">识别结果已人工核对</button>'
        : '')
    +'<span class="hint">这是该卡片当前唯一的下一步</span></div>'
    +'</div></div>';

  document.getElementById('content').innerHTML = '<div class="page-title">卡片 '+(esc(fv(curCard['合同编码']))||'')+'</div>'
    +'<div class="page-sub" style="margin-bottom:12px">'+actions+'</div>'
    +statusHtml
    +'<div class="tabs">'
    + '<div class="tab" data-tab="info">基础信息</div>'
    + '<div class="tab" data-tab="overview">金额概览</div>'
    + '<div class="tab" data-tab="ledger">合同法台账</div>'
    + '<div class="tab" data-tab="ifrs">IFRS台账</div>'
    +'</div>'
    +'<div id="tabBody">'+infoHtml+'</div>'
    +renderRelations(ctx);
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab==='info');});
  // 缓存台账数据供 tab 切换用，避免重复请求
  window._detailCache={overview:overview, ledger:ledger, ifrs:ifrs};
}

function tabOverview(ov){
  if(!ov.length) return '<div class="card"><div class="card-b"><div class="empty">'
    +'尚未录入金额概览。请点「录入金额」按计费分段填写（系统会据此展开为月度台账）。</div></div></div>';
  var rows=ov.map(function(r){
    return '<tr><td class="tnum">'+esc((fv(r['租赁起始日'])||'').slice(0,10))+'</td>'
      +'<td class="tnum">'+esc((fv(r['租赁终止日'])||'').slice(0,10))+'</td>'
      +'<td class="num">'+num(r['月份数'])+'</td>'
      +'<td class="num">'+money(r['月金额'])+'</td>'
      +'<td class="num">'+money(r['金额小计'])+'</td></tr>';
  }).join('');
  var total=ov.reduce(function(a,r){return a+(Number(fv(r['金额小计']))||0);},0);
  rows+='<tr><td colspan="4" style="text-align:right;font-weight:600">合计</td><td class="num">'+money(total)+'</td></tr>';
  return table(['起始日','终止日','月份数','月金额','金额小计'],rows);
}

var _ledgerEdit=false;
function numRaw(v){var x=fv(v);return (x===''||x==null)?'0':String(Number(x)||0);}
function tabLedger(ledger){
  if(!ledger.length) return empty('尚未生成合同法台账，请先录入金额概览并点击"生成台账"');
  var st=fv(curCard&&curCard['审批状态']);
  var editable=canCreate() && (st==='草稿'||st==='退回');
  var heads=['月份','合同金额','降租金额','未付款','已付款','实付金额合计','预付科目余额'];
  var bar='';
  if(editable){
    bar='<div style="margin-bottom:12px">'
      +(_ledgerEdit
        ? '<button class="btn btn-primary btn-sm" data-action="ledger-save">保存并重算</button> '
          +'<button class="btn btn-ghost btn-sm" data-action="ledger-toggle-edit">取消调整</button> '
          +'<span class="hint" style="color:var(--destructive)">编辑中：可改「降租金额 / 未付款 / 已付款」，改完点「保存并重算」。保存时校验末月预付科目余额须为 0。</span>'
        : '<button class="btn btn-secondary btn-sm" data-action="ledger-toggle-edit">复核调整（降租 / 未付款 / 已付款）</button> '
          +'<span class="hint">系统自动生成后可人工复核手调，保存后联动重算 IFRS。</span>')
      +'</div>';
  } else {
    var _why = !canCreate()
      ? '当前角色无台账调整权限（需「管理员」或「台账维护人」），如需调整请联系台账维护人'
      : ('该卡片审批状态为「'+(fv(st)||'—')+'」，仅「草稿 / 退回」状态可调整');
    bar='<div style="margin-bottom:12px"><span class="hint">当前不可「复核调整」：'+esc(_why)+'。</span></div>';
  }
  var rows=ledger.map(function(r){
    var ym=esc((fv(r['月份'])||'').slice(0,10));
    var ymKey=(fv(r['月份'])||'').slice(0,7);
    if(_ledgerEdit){
      function inp(k){
        return '<td><input class="input led-in" data-ym="'+esc(ymKey)+'" data-k="'+k+'" type="number" step="0.01" value="'+numRaw(r[k])+'" style="width:110px"></td>';
      }
      return '<tr><td class="tnum">'+ym+'</td><td class="num">'+money(r['合同金额'])+'</td>'
        +inp('降租金额')+inp('未付款')+inp('已付款')
        +'<td class="num">'+money(r['实付金额合计'])+'</td><td class="num">'+money(r['预付科目余额'])+'</td></tr>';
    }
    return '<tr><td class="tnum">'+ym+'</td>'
      +'<td class="num">'+money(r['合同金额'])+'</td><td class="num">'+money(r['降租金额'])+'</td>'
      +'<td class="num">'+money(r['未付款'])+'</td><td class="num">'+money(r['已付款'])+'</td>'
      +'<td class="num">'+money(r['实付金额合计'])+'</td><td class="num">'+money(r['预付科目余额'])+'</td></tr>';
  }).join('');
  return bar+table(heads,rows)
    +((editable&&_ledgerEdit)
      ? '<div style="margin-top:12px"><button class="btn btn-primary btn-sm" data-action="ledger-save">保存并重算</button> '
        +'<span class="hint">保存时校验末月预付科目余额须为 0，并联动重算 IFRS。</span></div>'
      : '');
}
function tabIfrs(ifrs){
  if(ifrs && ifrs.length){
    var rows=ifrs.map(function(r){
      return '<tr><td class="tnum">'+esc((fv(r['月份'])||'').slice(0,10))+'</td>'
        +'<td class="num">'+num(r['资产折旧'])+'</td><td class="num">'+num(r['负债利息'])+'</td>'
        +'<td class="num">'+num(r['租赁付款额'])+'</td><td class="num">'+num(r['折现倍数'])+'</td>'
        +'<td class="num">'+num(r['现值'])+'</td><td class="num">'+num(r['租赁负债余额'])+'</td><td class="num">'+num(r['使用权资产余额'])+'</td></tr>';

      +'<br>若确需并入，请到「基础信息 → 编辑基础信息」把「是否IFRS」改为「是」、填写 IFRS 折现率后，重新生成台账。</div></div></div>';
  }
  var h='<div class="card"><div class="card-b" style="line-height:1.9">'
    +'<div class="empty" style="padding-bottom:10px">本合同已并入 IFRS，但 IFRS 台账<b>尚未生成</b>。'
    +'<br>IFRS 台账会随「生成台账」<b>一并生成</b>（不需要单独点别的入口）。</div>';
  if(canCreate() && editable){
    h+='<button class="btn btn-primary btn-sm" data-action="gen-ledger" data-id="'+esc(curCard['record_id'])+'" data-from="ifrs">生成台账（含 IFRS）</button>';
    h+=' <span class="hint">前提：已录入「金额概览」。</span>';
  }else{
    h+='<span class="hint">当前不可生成：'
      +(canCreate()?('审批状态为「'+esc(st)+'」，仅「草稿 / 退回」可生成；如需重算请先退回'):'当前角色无生成权限（需「管理员」或「台账维护人」）')
      +'。</span>';
  }
  h+='</div></div>';
  return h;
}
function kv(k,v){ return '<div class="item"><span class="k">'+k+'</span><span class="v">'+esc(fv(v))+'</span></div>'; }

/* 金额概览编辑 */
var segs=[];
async function openOverview(id){
  // 若传了 id（从列表进入），先加载卡片
  if(id && (!curCard || curCard['record_id']!==id)){
    var r=await API.req('GET','/api/cards/'+id);
    if(!r.data.ok){alert(r.data.error||'加载失败');return;}
    curCard=r.data.card;
  }
  if(!curCard){alert('请先打开卡片');return;}
  // 预填已有分段
  segs=[];
  var ov=(await API.req('GET','/api/cards/'+curCard['record_id']+'/overview')).data.overview||[];
  ov.forEach(function(o){segs.push({s:(fv(o['租赁起始日'])||'').slice(0,10),e:(fv(o['租赁终止日'])||'').slice(0,10),
    months:fv(o['月份数'])||'1',amt:fv(o['月金额'])||'',total:fv(o['金额小计'])||''});});
  if(!segs.length) segs.push({s:'',e:'',months:'1',amt:'',total:''});
  document.getElementById('dlgCard').querySelector('.dialog-h').textContent='金额概览（计费分段）';
  setDlgConfirm('save-overview','保存分段');
  document.getElementById('dlgCardBody').innerHTML =
    '<div class="hint" style="margin-bottom:12px">按计费分段录入，生成台账时自动展开为自然月明细。</div>'
    +'<div id="segList"></div>'
    +'<button class="btn btn-secondary btn-sm" data-action="seg-add">＋ 添加分段</button>';
  showDlg('dlgCard');
  refreshSegs();
}
var SEG_HEAD='<div class="seg-row seg-head"><div>起始日</div><div>终止日</div><div>月份数</div><div>月金额</div><div>金额小计</div><div></div></div>';
function refreshSegs(){
  var list=document.getElementById('segList');

// 期次 → 起止日：保留合同起始日的"日"（月中起租不被拉回当月1日），跨月末自动收敛；
// 期末日 = 下一期首日的前一天，且不得越过合同终止日。
function periodStart(startIso,offset){
  if(!/^\d{4}-\d{2}-\d{2}/.test(String(startIso||''))) return '';
  var d=new Date(startIso+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  var day=d.getDate();
  // 用 Date 自行进位（offset 跨年时月份会 >12，必须让年份同步进位，否则出现 2025-13-01）
  var dt=new Date(d.getFullYear(), d.getMonth()+offset, 1);
  var y=dt.getFullYear(), m=dt.getMonth();
  var last=new Date(y,m+1,0).getDate();
  return y+'-'+String(m+1).padStart(2,'0')+'-'+String(Math.min(day,last)).padStart(2,'0');
}
function addDays(iso,n){
  var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function periodsToSegs(startIso,endIso,periods){
  var out=[];
  if(!periodStart(startIso,0)) return out;   // 起始日非法则不出草稿，交由人工录入
  (periods||[]).forEach(function(x){
    var a=Number(x['期次起'])||1, b=Number(x['期次止'])||a;
    if(b<a) return;
    var pb=periodStart(startIso,b);
    if(!pb) return;
    var s=periodStart(startIso,a-1), e=addDays(pb,-1);
    if(endIso && e>endIso) e=endIso;
    if(e<s) return;
    var amt=Number(String(x['金额']||'').replace(/,/g,''))||0;
    var months=b-a+1;
    out.push({s:s,e:e,months:months,amt:amt.toFixed(2),
              total:String((amt*months).toFixed(2)),pf:a,pt:b});
  });
  return out;
}
// 按最新起始/终止日重建金额概览草稿（用户改了起止日也能跟随）
function rebuildSegsFromPeriods(){
  var periods=window._ocrPeriods||[];
  if(!periods.length) return false;
  var startIso=gv('card_start');
  if(!startIso) return false;
  segs=periodsToSegs(startIso,gv('card_end'),periods);
  return segs.length>0;
}
// 由付款计划表推导期次偏移（与 importer._period_offsets 对齐），把合计金额摊到月
function _periodOffsets(period, startIso){
  if(!period || !/^\d{4}-\d{2}-\d{2}/.test(String(startIso||''))) return null;
  var m=String(period).match(/(\d{4})\s*年\s*(\d{1,2})(?:\s*月)?(?:\s*(?:至|到|-|—|–)\s*(\d{1,2})\s*月)?/);
  if(!m) return null;
  var y=+m[1], ms=+m[2], me=m[3]?+m[3]:ms;
  var d=new Date(startIso+'T00:00:00'); if(isNaN(d.getTime())) return null;
  var ry=d.getFullYear(), rm=d.getMonth()+1;
  return [(y-ry)*12+(ms-rm)+1, (y-ry)*12+(me-rm)+1];
}
function _paymentTableToPeriods(ptable, startIso){
  var out=[];
  (ptable||[]).forEach(function(r){
    var offs=_periodOffsets(r.period, startIso);
    if(!offs) return;
    var total=parseFloat(String(r.total||'').replace(/,/g,''))||0;
    var months=offs[1]-offs[0]+1;
    var monthly=months>0?(total/months):0;
    out.push({期次起:offs[0], 期次止:offs[1], 金额:monthly.toFixed(2)});
  });
  return out;
}
// 回填：空则填；若当前值来自上一次识别则允许刷新；用户手工填过则保留不覆盖

}
function setOcrSel(id,val){
  var el=document.getElementById(id);
  if(!el||!val) return null;
  var v=String(val).trim(), ok=false;
  for(var i=0;i<el.options.length;i++){ if(el.options[i].value===v||el.options[i].text===v){ v=el.options[i].value; ok=true; break; } }
  if(!ok) return 'nomatch';   // 值不在选项中，不强行赋值（会静默失败）
  var cur=String(el.value||'').trim();
  window._ocrFilled=window._ocrFilled||{};
  // 下拉框默认会选中第一项，把它视为"未填写"，允许识别结果覆盖；仅当用户主动选了非首项才保留
  var isDefault = el.options.length>0 && cur===String(el.options[0].value);
  if(cur && !isDefault && cur!==String(window._ocrFilled[id]||'')) return 'kept';
  el.value=v; window._ocrFilled[id]=v; return 'set';
}

async function ocrRun(){
  var f=document.getElementById('ocrFile').files[0];
  var st=document.getElementById('ocrStatus');
  if(!f){st.textContent='请先选择文件';return;}
  st.textContent='识别中…（首次加载识别引擎可能较慢）';
  var data=await new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(f);});
  var r;
  try{
    r=await API.req('POST','/api/upload',{filename:f.name,data:data},180000);   // 引擎首次加载可能较久
  }catch(err){
    st.textContent='识别超时或网络中断：'+f.name+'（'+(f.size/1024/1024).toFixed(2)+'MB）。'
      +'请缩小文件（建议单页、不超过 5MB）后重试，或先手工录入。';
    return;
  }
  if(!r.data.ok || r.data.error){st.textContent='识别失败：'+(r.data.error||'请重试');return;}
  applyOcrResult(r.data);
}

// 把结构化识别结果（OCR 接口返回 或 AI 扫描深链草稿）填充进建卡表单。
// data 结构：{fields(中文键), segments?, payment_table?, sharing?, conflicts?, text?}
function applyOcrResult(data){
  var fd=data.fields||{};
  var ptable=data.payment_table||[];
  var sharing=data.sharing||[];
  window._ocrSharing = sharing;
  window._ocrApplied = true;      // 标记本表单内容来自识别结果，落库时记为"已识别待核对"

  window._ocrFilled={};
  var got=[], kept=[], nomatch=[];
  function fill(id,val,label){
    var res=setOcrVal(id,val);
    if(res==='set') got.push(label);
    else if(res==='kept') kept.push(label);
  }
  function fillSel(id,val,label){
    var res=setOcrSel(id,val);
    if(res==='set') got.push(label);
    else if(res==='kept') kept.push(label);
    else if(res==='nomatch') nomatch.push(label+'（识别为"'+(val||'')+'"，不在选项中，请手选）');
  }

  function pick(){ for(var i=0;i<arguments.length;i++){ var x=arguments[i]; if(x!=null && String(x).trim()!=='') return x; } return ''; }
  fill('card_code',pick(fd['合同编号'],fd['合同编码']),'合同编码');
  fill('card_name',fd['卡片名称'],'卡片名称');
  fill('card_tenant',fd['承租方'],'承租方');
  fill('card_receiver',pick(fd['出租方'],fd['实际收款方']),'出租方→实际收款方');
  fill('card_payer',pick(fd['实际付款方'],fd['承租方']),'实际付款方');
  fill('card_addr',fd['租赁地址'],'租赁地址');
  fill('card_prov',fd['省级'],'省级');
  fill('card_city',fd['市级'],'市级');
  fill('card_dist',fd['区镇'],'区镇');
  fill('card_area',fd['片区'],'片区');
  fill('card_module',fd['业务模块'],'业务模块');
  fill('card_start',(fd['租赁起始日']||'').slice(0,10),'租赁起始日');
  fill('card_end',(fd['租赁终止日']||'').slice(0,10),'租赁终止日');
  fill('card_barea',String(pick(fd['建筑面积'],fd['计租面积'])||'').replace(/,/g,''),'建筑面积');
  fill('card_uarea',String(fd['实用面积']||'').replace(/,/g,''),'实用面积');
  fill('card_payday',fd['约定付款日'],'约定付款日');
  fill('card_rate',fd['IFRS折现率'],'IFRS折现率');
  fill('card_prepaid',fd['预付租金'],'预付租金');
  fillSel('card_fee',fd['费用类型'],'费用类型');
  fillSel('card_alg',fd['计费算法'],'计费算法');
  fillSel('card_settle',fd['结算方式'],'结算方式');
  fillSel('card_dept',fd['提单部门'],'提单部门');
  fillSel('card_tax',fd['是否含税'],'是否含税');
  fillSel('card_ifrs',fd['是否IFRS'],'是否IFRS');

  if(fd['递增约定']){
    var noteRes=setOcrVal('card_note','递增约定：'+fd['递增约定']);
    if(noteRes==='set') got.push('递增约定');
    else if(noteRes==='kept') kept.push('递增约定');
  }
  // 财务摘要并入备注（卡片表头无独立租金/管理费/保证金字段，集中保留供复核）
  var fin=[];

  if(fd['出租方信用代码']) fin.push('出租方信用代码：'+fd['出租方信用代码']);
  if(fd['承租方信用代码']) fin.push('承租方信用代码：'+fd['承租方信用代码']);
  if(fd['出租方开户行']) fin.push('出租方开户行：'+fd['出租方开户行']);
  if(fd['出租方银行账号']) fin.push('出租方账号：'+fd['出租方银行账号']);
  if(fd['承租方开户行']) fin.push('承租方开户行：'+fd['承租方开户行']);
  if(fd['承租方银行账号']) fin.push('承租方账号：'+fd['承租方银行账号']);
  if(fin.length){

  }

  // 付款计划 → 金额概览草稿：优先用接口返回的 segments，否则由付款计划表推导
  if((data.segments||[]).length){

    window._ocrPeriods=_paymentTableToPeriods(ptable, fd['租赁起始日']||'');
  } else {

  window._ocrText=data.text||'';
  var segList=window._ocrPeriods;
  var okSegs=rebuildSegsFromPeriods();

  if(hint){

      hint.textContent=okSegs
        ? ('付款计划已识别 '+segList.length+' 段，已按租赁起始日换算为金额概览草稿：'
           +segs.map(function(x){return x.s+'~'+x.e+' 月'+x.amt;}).join('；'))
        : ('付款计划已识别 '+segList.length+' 段，但缺少「租赁起始日」，暂时无法换算日期。'

        +'也可在保存卡片后，用列表里的「录入金额」手工填写。';
      hint.style.color='var(--destructive)';
    }

  // 可编辑明细：付款计划 / 分摊比例 / 一次性费用（识别结果作初值，人工可改；保存时一并落库）
  window._ptable=(ptable||[]).map(function(r){return {period:r.period||'',pay_date:r.pay_date||'',rent:r.rent||'',mgmt:r.mgmt||'',total:r.total||'',tax:r.tax||''};});
  window._sharing=(sharing||[]).map(function(s){return {dept:s.dept||'',ratio:(s.ratio==null?0:Number(s.ratio)),cost_center:s.cost_center||'',note:s.note||''};});
  window._oneoff=(data.oneoff_fees||[]).map(function(o){return {'费用类型':o['费用类型']||o.type||'','金额':String(o['金额']||o.amount||''),'说明':o['说明']||o.note||''};});
  window._ocrFin=fin;
  window._taxRate=fd['税率']||fd['tax_rate']||window._taxRate||'';
  renderDetailTables();

  var cf=data.conflicts||{};
  var confItems=[];
  Object.keys(cf).forEach(function(k){ confItems.push(k+'（'+cf[k].join(' / ')+'）'); });
  var st0=document.getElementById('ocrStatus');
  if(!got.length && !kept.length && !segList.length && !nomatch.length && !confItems.length){
    if(st0) st0.textContent='未识别到可用字段：请确认上传的是合同扫描件，或换更清晰的图片后重试，也可直接手工录入。';
    return;
  }
  var missed=[];
  [['租赁起始日','租赁起始日'],['租赁终止日','租赁终止日'],['承租方','承租方']]
   .forEach(function(p){ if(!fd[p[1]]) missed.push(p[0]); });
  var msg='识别完成。';
  if(got.length) msg+='已填：'+got.join('、')+'。';
  if(kept.length) msg+='已保留你手工填写的内容：'+kept.join('、')+'。';
  if(segList.length) msg+='付款计划 '+segList.length+' 段已转为金额概览草稿'

  else msg+='未识别到付款计划表，金额概览需手工录入。';
  if(ptable.length) msg+='付款计划表 '+ptable.length+' 期已识别（见下方明细）。';
  if(sharing.length) msg+='分摊比例 '+sharing.length+' 项已预填，保存卡片时自动写入。';
  if(nomatch.length) msg+=nomatch.join('；')+'。';
  if(confItems.length) msg+='以下字段有多个候选值，未自动填，请人工确认：'+confItems.join('；')+'。';
  if(missed.length) msg+='未识别到 '+missed.join('、')+'，请手工补充。';
  if(st0) st0.textContent=msg;
}

// 深链草稿预填：?draft=<base64(JSON)> 由 AI 扫描 Skill 生成；打开建卡弹窗并自动填充，供人工复核后保存。
function loadDraftFromUrl(){
  try{
    var q=new URLSearchParams(location.search);
    var b64=q.get('draft');
    if(!b64) return;
    // 支持 URL-safe base64（Skill 生成时用 -/_ 避免 + 被解析成空格），补 padding 后 atob
    b64=b64.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4) b64+='=';
    var json=decodeURIComponent(escape(atob(b64)));
    var d=JSON.parse(json);
    if(!d || typeof d!=='object') return;
    _applyAiRaw(d, null, 'AI 深链');                   // 深链同样走容错归一，保证与粘贴导入一致
    history.replaceState({}, '', location.pathname);   // 消费后清理 URL，避免刷新重填
  }catch(err){
    console.error('draft parse failed', err);
    alert('AI 扫描草稿解析失败：'+(err&&err.message||''));
  }
}
// AI 扫描入口：展开/收起粘贴框；把 AI 扫描结果（预填链接或 JSON）导入并预填建卡表单。
function _b64urlToJson(b64){
  b64=String(b64||'').trim().replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4) b64+='=';
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}

function _nkey(k){ return String(k==null?'':k).toLowerCase().replace(/[\s_\-:：()（）\[\]【】.、,，]/g,''); }
var _AI_IDX=null;
function _aiIndex(){
  if(_AI_IDX) return _AI_IDX;
  _AI_IDX={};
  Object.keys(AI_ALIAS).forEach(function(c){ AI_ALIAS[c].forEach(function(a){ _AI_IDX[_nkey(a)]=c; }); _AI_IDX[_nkey(c)]=c; });
  return _AI_IDX;
}
function _findKey(obj,canon){
  if(!obj) return null;
  var idx=_aiIndex(), nk=_nkey(canon);
  for(var k in obj){ if(Object.prototype.hasOwnProperty.call(obj,k) && idx[_nkey(k)]===nk) return k; }
  return null;
}
function _num(v){
  if(v==null||v==='') return null;
  var m=String(v).replace(/[￥¥,\s，]/g,'').match(/-?\d+(?:\.\d+)?/);
  if(!m) return null; var n=parseFloat(m[0]); return isNaN(n)?null:n;
}
function _money(v){ var n=_num(v); return n==null?null:n.toFixed(2); }
function _date(v){
  if(v==null||v==='') return null;
  var s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var m=s.match(/(\d{4})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/);
  if(!m) return null;
  return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
}
function _ratio(v){ var n=_num(v); if(n==null) return null; return (String(v).indexOf('%')>=0||n>1)?n/100:n; }
function _settle(v){
  if(!v) return null;
  var s=String(v).replace(/\s/g,'');
  var opts=['付当月','预付下月','付两月','预付两月','付当季','预付下季','付半年','预付半年','付当年','预付下年'];
  for(var i=0;i<opts.length;i++){ if(s===opts[i]) return s; }
  // 十选项中，"预付下X"=预缴下一期；其余=缴当期。合同常写「按季预付…支付当季费用」→应归为「付当季」
  var next=/下|次/.test(s);
  if(/季/.test(s)) return next?'预付下季':'付当季';
  if(/半年|6个月|六个月/.test(s)) return next?'预付半年':'付半年';
  if(/两月|双月|2个月|两个月/.test(s)) return next?'预付两月':'付两月';
  if(/年/.test(s)) return next?'预付下年':'付当年';
  if(/月/.test(s)) return next?'预付下月':'付当月';
  return null;
}
function _taxIncl(v){ if(!v) return null; var s=String(v); if(/不含税/.test(s)) return '不含税'; if(/含税/.test(s)) return '含税'; return null; }
function _ifrs(v){
  if(!v) return null; var s=String(v).trim();
  if(/^(是|yes|y|true|1|适用|需要)$/i.test(s)) return '是';
  if(/^(否|no|n|false|0|不适用|不需要)$/i.test(s)) return '否';
  if(/不适用|无需/.test(s)) return '否';
  if(/适用|需要/.test(s)) return '是';
  return null;
}
function _absPeriod(period,startIso){
  var s=String(period==null?'':period).trim();
  if(!s) return '';
  if(/\d{4}\s*年/.test(s)) return s;
  var m=s.match(/(\d{1,3})\s*(?:至|到|-|—|–|~)\s*(\d{1,3})/) || s.match(/第?\s*(\d{1,3})\s*个?月/);
  if(!m) return s;
  var d=new Date((startIso||'')+'T00:00:00'); if(isNaN(d.getTime())) return s;
  var a=+m[1], b=m[2]?+m[2]:a;
  function ym(off){ var t=new Date(d.getFullYear(),d.getMonth()+(off-1),1); return [t.getFullYear(),t.getMonth()+1]; }
  var A=ym(a), B=ym(b);
  if(A[0]===B[0]) return (a===b)?(A[0]+'年'+A[1]+'月'):(A[0]+'年'+A[1]+'至'+B[1]+'月');
  return A[0]+'年'+A[1]+'月';

  var out={fields:{},payment_table:[],sharing:[],oneoff_fees:[]}, start='';
  Object.keys(AI_ALIAS).forEach(function(canon){

    var v=f[k]; if(v==null||String(v).trim()==='') return;
    var nv;
    if(canon==='租赁起始日'||canon==='租赁终止日') nv=_date(v);
    else if(canon==='月租金'||canon==='月管理费'||canon==='保证金'||canon==='IFRS折现率'||canon==='预付租金') nv=_money(v);
    else if(canon==='建筑面积'||canon==='实用面积'){ var nn=_num(v); nv=nn==null?String(v).trim():String(nn); }
    else if(canon==='结算方式') nv=_settle(v);
    else if(canon==='是否含税') nv=_taxIncl(v);
    else if(canon==='是否IFRS') nv=_ifrs(v);
    else nv=String(v).trim();
    if(nv==null||nv===''){ report.warn.push(canon+'("'+String(v).slice(0,18)+'"无法归一)'); return; }
    var allowed = canon==='计费算法'?['自然月','整月']:(canon==='费用类型'?['租金','管理费','租赁税金']:(canon==='提单部门'?['财务','业务']:null));
    if(allowed && allowed.indexOf(nv)<0){ report.warn.push(canon+'("'+nv+'"不在选项)'); return; }
    out.fields[canon]=nv; report.ok.push(canon);
    if(String(v).trim()!==nv) report.fixed.push(canon+': '+String(v).slice(0,16)+'→'+nv);
  });
  start=out.fields['租赁起始日']||_date(raw['租赁起始日']||raw.start_date)||'';
  pt.forEach(function(row,i){
    if(Array.isArray(row)) row={period:row[0],pay_date:row[1],rent:row[2],mgmt:row[3],total:row[4],tax:row[5]};
    var per=_absPeriod(row.period||row['费用所属期间']||row['期间'],start);
    var rent=_money(row.rent!=null?row.rent:row['租金']), mgmt=_money(row.mgmt!=null?row.mgmt:row['管理费']);
    var total=_money(row.total!=null?row.total:row['合计']);
    if(total==null&&rent!=null&&mgmt!=null) total=((+rent)+(+mgmt)).toFixed(2);
    if(!per&&!rent&&!mgmt&&total==null) return;
    out.payment_table.push({seq:i+1,period:per,pay_date:_date(row.pay_date||row['应付日'])||'',rent:rent||'0.00',mgmt:mgmt||'0.00',total:total||'0.00',tax:String((row.tax!=null?row.tax:row['税率'])||'')});

  });
  oo.forEach(function(row){
    if(Array.isArray(row)) row={'费用类型':row[0],'金额':row[1],'说明':row[2]};
    var ty=String((row['费用类型']!=null?row['费用类型']:(row.type||''))||'').trim();
    if(ONEOFF_TYPES.indexOf(ty)<0) ty=_oneoffType(ty);   // 按关键词归一到枚举；仍不中则留空
    var amt=_money(row['金额']!=null?row['金额']:row.amount);

  });
  var aiw=raw.warnings||raw.ai_warnings||raw['疑点']||raw['提示']||[];
  if(Array.isArray(aiw)){ aiw.forEach(function(w){ if(w&&String(w).trim()) report.ai_warn.push(String(w).trim()); }); }
  ['合同编码','出租方','承租方','租赁起始日','租赁终止日'].forEach(function(k){ if(!out.fields[k]) report.missing.push(k); });
  return {draft:out,report:report};

function ocrAiImport(){

  var raw=(ta&&ta.value||'').trim();
  if(!raw){ if(st) st.textContent='请先粘贴 AI 扫描链接或 JSON。'; return; }
  try{
    var d, m=raw.match(/[?&]draft=([A-Za-z0-9_\-\/+=]+)/);
    if(m){ d=_b64urlToJson(m[1]); }
    else {
      // 容忍 AI 常见的 Markdown 代码块围栏与前后说明文字：取其最外层 {…}
      var t=raw.replace(/^[\s\S]*?```[a-zA-Z]*\s*/,'').replace(/```[\s\S]*$/,'').trim();
      var i=t.indexOf('{'), j=t.lastIndexOf('}');
      if(i>=0&&j>i) t=t.slice(i,j+1);
      try{ d=JSON.parse(t); }catch(e2){ d=_b64urlToJson(raw); }
    }
    if(!d||typeof d!=='object') throw new Error('内容不是有效的 JSON');
    _applyAiRaw(d,st,'AI 结果');
  }catch(err){
    if(st) st.textContent='导入失败：'+((err&&err.message)||err)+'（请粘贴 AI 扫描链接或 JSON）';
  }

    return;
  }
  // OCR 已形成金额概览草稿时，随卡片创建自动落库；用户仍可在下一步复核修改
  if(segs && segs.length && r.data.card_id){
    var ov=await API.req('POST','/api/cards/'+r.data.card_id+'/overview',{segments:segs.map(function(x){return {'租赁起始日':x.s,'租赁终止日':x.e,'月份数':x.months,'月金额':x.amt,'金额小计':x.total};})});
    if(!ov.data.ok){alert('卡片已保存，但金额概览未保存：'+(ov.data.error||''));}
  } else if((window._ocrPeriods||[]).length && !rebuilt){
    alert('卡片已保存。付款计划已识别但缺少"租赁起始日"，金额概览未生成，请在卡片列表点「录入金额」补填。');
  }
  // 费用部门分摊比例（可编辑表）→ 随卡片创建写入「成本分摊」表
  if((window._sharing||[]).length && r.data.card_id){
    var shares = window._sharing.map(function(s){
      var note = s.note || '';
      // 成本分摊表无独立"承担部门"列：部门信息并入"变更依据"，成本中心保持纯净
      if(s.dept && s.dept !== s.cost_center){
        note = '承担部门：' + s.dept + (note ? ('；' + note) : '');
      }
      return {
        "成本中心": s.cost_center || '',
        "分摊比例": (typeof s.ratio === 'number') ? s.ratio : parseFloat(s.ratio||0),
        "生效日": b['租赁起始日'] || '',
        "倒挤": false,
        "变更依据": note
      };
    });
    try{
      var sr = await API.req('POST','/api/shares/'+r.data.card_id, {shares: shares});
      if(!sr.data.ok){ alert('卡片已保存，但分摊比例未写入：'+(sr.data.error||'')); }
    }catch(err){
      alert('卡片已保存，但分摊比例写入失败（网络）：'+(err&&err.message||''));
    }
  }
  // 一次性费用（可编辑表）→ 随卡片创建写入「一次性费用」表
  var oneoff = (window._oneoff||[]).filter(function(o){ return o['金额']!=='' && o['金额']!=null; });
  if(oneoff.length && r.data.card_id){
    try{
      var orr = await API.req('POST','/api/oneoff/'+r.data.card_id, {fees: oneoff});
      if(!orr.data.ok){ alert('卡片已保存，但一次性费用未写入：'+(orr.data.error||'')); }
    }catch(err){
      alert('卡片已保存，但一次性费用写入失败（网络）：'+(err&&err.message||''));
    }
  }
  window._ocrPeriods=[]; window._ocrFilled={}; window._ocrSharing=[];
  window._ptable=[]; window._sharing=[]; window._oneoff=[]; window._taxRate=''; window._ocrFin=[];
  closeDlg('dlgCard'); showMine();
}

async function voucherEvent(et){
  // 事件型凭证：对每个"已通过"且并入IFRS的卡片，用其IFRS台账推算变动量生成
  var all = await API.req('GET','/api/cards?state=通过');
  var cards=(all.data.cards||[]).filter(function(c){return fv(c['是否IFRS'])==='是';});
  if(!cards.length){alert('无已通过且并入IFRS的合同');return;}
  var tot=0;
  for(var c of cards){
    var ifrs=(await API.req('GET','/api/cards/'+c['record_id']+'/ifrs')).data.ifrs||[];
    if(!ifrs.length) continue;
    var params={};
    if(et==='租赁修改'){
      // 简化：用最后一期负债余额作为变动量示意（正式需人工核对）
      params={修改日:(fv(ifrs[0]['月份'])||'').slice(0,10), 租赁付款额变动:ifrs[ifrs.length-1]['租赁负债余额']||0,
              未确认融资费用变动:0, 原值变动:0, 累计折旧变动:0};
    } else {
      var orig=0,dep=0; ifrs.forEach(function(r){orig+=Number(r['租赁付款额']);dep+=Number(r['资产折旧']);});
      params={终止日:(fv(ifrs[ifrs.length-1]['月份'])||'').slice(0,10), 原值:orig, 累计折旧:dep,
              未确认融资费用:0, 租赁付款额余额:ifrs[ifrs.length-1]['租赁负债余额']||0, 处置损益:0};
    }
    var r=await API.req('POST','/api/vouchers/event/'+c['record_id'],{event_type:et,params:params});
    if(r.data.ok)tot+=r.data.vouchers;
  }
  alert('已生成 '+tot+' 行事件凭证（金额为系统推算初稿，请人工核对）');
  showVouchers();
}

/* 事件委托：统一处理所有 data-action */
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-action],[data-view],[data-tab]');
  if(!el) return;
  var a=el.dataset.action, v=el.dataset.view, t=el.dataset.tab, id=el.dataset.id;
  if(v){
    navigate(v);          // 统一走路由表，不再散落 if/else
    return;
  }
  if(a==='show-home-next'){ var nv=el.dataset.viewTarget; if(nv){ navigate(nv); } return; }
  if(t && curCard){
    switchTab(t);
    return;
  }
  switch(a){
    case 'close-dlg': closeDlg(el.dataset.id); break;
    case 'open-card': openCard(); break;
    case 'create-card': createCard(); break;
    case 'show-cards': if(canCreate())showMine(); else showCards(); break;
    case 'card-detail': showDetail(id); break;
    case 'next-action': showDetail(id); break;   // 首页/列表的"下一步"统一进入该卡片详情
    case 'ocr-confirm': await confirmOcr(id); break;
    case 'card-submit': doSubmit(id); break;
    case 'card-delete': doDelete(id); break;
    case 'approve': openOpinion(id,'通过'); break;
    case 'reject': openOpinion(id,'退回'); break;
    case 'opin-ok': doOpinion(); break;
    case 'edit-overview': openOverview(id); break;
    case 'save-overview': saveOverview(); break;
    case 'gen-ledger': genLedger(id, el.dataset.from); break;
    case 'seg-add': segs.push({s:'',e:'',months:'1',amt:'',total:''}); refreshSegs(); break;
    case 'seg-del': segs.splice(Number(el.dataset.i),1); refreshSegs(); break;
    case 'pay-toggle': payToggle(id); break;
    case 'pay-submit': paySubmit(); break;
    case 'pay-gen': payGen(); break;
    case 'voucher-gen-all': voucherGenAll(); break;
    case 'master-load': _masterType=document.getElementById('masterType').value; loadMaster(); break;
    case 'master-add': masterAdd(); break;
    case 'master-save': masterSave(); break;
    case 'export-csv': exportCsv(el.dataset.kind); break;
    case 'ocr-run': ocrRun(); break;
    case 'ocr-text': ocrText(); break;
    case 'ocr-ai': ocrAiToggle(); break;
    case 'ocr-ai-import': ocrAiImport(); break;
    case 'ocr-ai-prompt': ocrAiCopyPrompt(); break;
    case 'detail-add': {
      var _t=el.dataset.tbl;
      if(_t==='pt') (window._ptable=window._ptable||[]).push({period:'',pay_date:'',rent:'',mgmt:'',total:'',tax:''});
      else if(_t==='sh') (window._sharing=window._sharing||[]).push({dept:'',ratio:0,cost_center:'',note:''});
      else (window._oneoff=window._oneoff||[]).push({'费用类型':'','金额':'','说明':''});
      renderDetailTables();
      if(_t==='pt') _syncPeriodsFromPtable();
      break;
    }
    case 'detail-del': {
      var _t2=el.dataset.tbl, _i=Number(el.dataset.i);
      var _arr=_t2==='pt'?window._ptable:(_t2==='sh'?window._sharing:window._oneoff);
      if(_arr&&_i>=0){ _arr.splice(_i,1); renderDetailTables(); if(_t2==='pt') _syncPeriodsFromPtable(); }
      break;
    }
    case 'voucher-event': voucherEvent(el.dataset.et); break;
    case 'edit-basic': openEditBasic(); break;
    case 'save-basic': saveEditBasic(); break;
    case 'ledger-toggle-edit': ledgerToggleEdit(); break;
    case 'ledger-save': ledgerSave(); break;
    case 'register-submit': submitRegister(); break;
    case 'req-approve': reqApprove(id); break;
    case 'req-reject': reqReject(id); break;
  }
});
document.addEventListener('click',function(e){
  if(e.target.closest('[data-rtab]')){
    var rt=e.target.closest('[data-rtab]').dataset.rtab;
    document.querySelectorAll('.rtab').forEach(function(x){x.classList.toggle('active',x.dataset.rtab===rt);});
    renderReportTab(rt);
  }
});
document.addEventListener('input',function(e){
  // 改月份数/月金额 → 自动重算小计；手改小计则保留手改值
  if(e.target.classList.contains('seg-m')||e.target.classList.contains('seg-a')){
    var k=Number(e.target.dataset.i), sg=segs[k]; if(!sg) return;
    sg.months=e.target.classList.contains('seg-m')?e.target.value:sg.months;
    sg.amt=e.target.classList.contains('seg-a')?e.target.value:sg.amt;
    segRecalc(k);
    return;
  }
  if(e.target.classList.contains('seg-t')){
    var m=Number(e.target.dataset.i), s2=segs[m]; if(!s2) return;
    s2.total=e.target.value; updateSegSum();
  }
});
document.addEventListener('change',function(e){
  // 填了租赁起始日后，把已识别的付款计划期次换算成金额概览草稿
  if(e.target.id==='card_start'||e.target.id==='card_end'){
    if((window._ocrPeriods||[]).length){
      var ok=rebuildSegsFromPeriods();
      var hint=document.getElementById('ocrSegHint');
      if(hint){
        hint.textContent = ok
          ? ('已按租赁起始日换算 '+segs.length+' 段：'+segs.map(function(x){return x.s+'~'+x.e+' 月'+x.amt;}).join('；'))
          : '仍缺少「租赁起始日」，无法换算各段日期，请填写后再保存。';
        hint.style.color = ok ? 'var(--muted-fg)' : 'var(--destructive)';
      }
    }
    return;
  }
  if(e.target.classList.contains('seg-s')||e.target.classList.contains('seg-e')){
    var i=Number(e.target.dataset.i), s=segs[i];
    if(!s)return;
    var sEl=document.querySelector('.seg-s[data-i="'+i+'"]'),
        eEl=document.querySelector('.seg-e[data-i="'+i+'"]');
    s.s=sEl.value; s.e=eEl.value;
    var start=new Date(s.s), end=new Date(s.e);
    if(s.s&&s.e&&end>=start){
      var months=(end-start)/86400000/30.44;
      s.months=months.toFixed(2);
      document.querySelector('.seg-m[data-i="'+i+'"]').value=s.months;
      var amt=parseFloat(s.amt)||0;
      s.total=(amt*months).toFixed(2);
      document.querySelector('.seg-t[data-i="'+i+'"]').value=s.total;
    }
  }
  if(e.target.classList.contains('seg-m')||e.target.classList.contains('seg-a')){
    var j=Number(e.target.dataset.i), sg=segs[j]; if(!sg)return;
    sg.months=document.querySelector('.seg-m[data-i="'+j+'"]').value;
    sg.amt=document.querySelector('.seg-a[data-i="'+j+'"]').value;
  }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && document.getElementById('loginView').style.display!=='none' && !document.getElementById('appView').style.display){login();}
});
// 明细表格编辑：改值即同步回内存数组（付款计划改动会重算金额概览）
document.addEventListener('input',function(e){
  var el=e.target;
  if(!el||!el.dataset||!el.dataset.tbl) return;
  var tbl=el.dataset.tbl, i=Number(el.dataset.i), k=el.dataset.k, v=el.value;
  var arr=tbl==='pt'?window._ptable:(tbl==='sh'?window._sharing:window._oneoff);
  if(!arr||!arr[i]) return;
  if(tbl==='sh'&&k==='ratioPct') arr[i].ratio=(parseFloat(v)||0)/100;
  else arr[i][k]=v;
  if(tbl==='pt') _syncPeriodsFromPtable();
});
